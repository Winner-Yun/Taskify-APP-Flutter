name: to_do_list_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.2
  floating_bottom_bar: ^0.0.3
  table_calendar: ^3.0.9
  intl: ^0.19.0
  image_picker: ^1.1.0
  get: ^4.7.3
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.2
  connectivity_plus: ^6.0.3
  internet_connection_checker_plus: ^2.5.2

  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0

  sqflite: ^2.3.0
  path: ^1.9.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logoTaskify.png"
  min_sdk_android: 21
  remove_alpha_ios: true
